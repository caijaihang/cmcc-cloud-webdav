name: Build CMCC Cloud WebDAV and Auto Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            DATE=$(date +%Y.%m.%d)
            BUILD=${{ github.run_number }}
            echo "TAG_NAME=v${DATE}-${BUILD}" >> $GITHUB_OUTPUT
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: Release ${{ steps.version.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-windows:
    needs: create-release
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install VC++ Redistributable
        run: |
          choco install vcredist140 -y
          choco install vcredist2015 -y
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -r requirements.txt
      - name: Collect Windows DLLs
        run: |
          $dllDir = "win_dlls"
          New-Item -ItemType Directory -Force -Path $dllDir
          $sysPaths = @("C:\Windows\System32", "C:\Windows\SysWOW64")
          $dlls = @("api-ms-win-core-path-l1-1-0.dll", "api-ms-win-crt-runtime-l1-1-0.dll", "api-ms-win-crt-stdio-l1-1-0.dll", "api-ms-win-crt-heap-l1-1-0.dll", "api-ms-win-crt-string-l1-1-0.dll", "api-ms-win-crt-convert-l1-1-0.dll", "api-ms-win-crt-environment-l1-1-0.dll", "api-ms-win-crt-time-l1-1-0.dll", "api-ms-win-crt-utility-l1-1-0.dll", "api-ms-win-crt-math-l1-1-0.dll", "api-ms-win-crt-locale-l1-1-0.dll", "api-ms-win-crt-filesystem-l1-1-0.dll", "api-ms-win-crt-process-l1-1-0.dll", "api-ms-win-crt-conio-l1-1-0.dll", "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "ucrtbase.dll")
          foreach ($dll in $dlls) {
            foreach ($path in $sysPaths) {
              $fp = Join-Path $path $dll
              if (Test-Path $fp) {
                Copy-Item $fp $dllDir -Force
                Write-Host "Copied $dll from $path"
                break
              }
            }
          }
        shell: pwsh
      - name: Build windowed
        run: |
          pyinstaller --name CMCCCloudWebDAV --onefile --windowed `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --hidden-import ctypes `
            --hidden-import ctypes.wintypes `
            --hidden-import socket `
            --hidden-import ssl `
            --hidden-import urllib3 `
            --hidden-import charset_normalizer `
            --hidden-import certifi `
            --hidden-import idna `
            --hidden-import json `
            --hidden-import logging `
            --hidden-import hashlib `
            --hidden-import threading `
            --hidden-import tempfile `
            --hidden-import mimetypes `
            --hidden-import datetime `
            --hidden-import io `
            --hidden-import os `
            --hidden-import sys `
            --hidden-import time `
            --hidden-import base64 `
            --hidden-import random `
            --hidden-import string `
            --hidden-import webbrowser `
            --hidden-import subprocess `
            --hidden-import argparse `
            --hidden-import configparser `
            --hidden-import pathlib `
            --hidden-import cryptography `
            --hidden-import cryptography.hazmat.primitives.ciphers.aead `
            --collect-all PIL `
            --collect-all pystray `
            --collect-all requests `
            --collect-all cheroot `
            --collect-all wsgidav `
            --collect-all cryptography `
            --collect-all urllib3 `
            --collect-all charset_normalizer `
            --collect-all certifi `
            --collect-all idna `
            --collect-binaries PIL `
            --collect-binaries pystray `
            --collect-data PIL `
            --collect-data pystray `
            --collect-data certifi `
            --add-binary win_dlls;. `
            --win-private-assemblies `
            --noupx `
            --clean --noconfirm main.py
      - name: Build console
        run: |
          pyinstaller --name CMCCCloudWebDAV-console --onefile --console `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --hidden-import ctypes `
            --hidden-import ctypes.wintypes `
            --hidden-import socket `
            --hidden-import ssl `
            --hidden-import urllib3 `
            --hidden-import charset_normalizer `
            --hidden-import certifi `
            --hidden-import idna `
            --hidden-import json `
            --hidden-import logging `
            --hidden-import hashlib `
            --hidden-import threading `
            --hidden-import tempfile `
            --hidden-import mimetypes `
            --hidden-import datetime `
            --hidden-import io `
            --hidden-import os `
            --hidden-import sys `
            --hidden-import time `
            --hidden-import base64 `
            --hidden-import random `
            --hidden-import string `
            --hidden-import webbrowser `
            --hidden-import subprocess `
            --hidden-import argparse `
            --hidden-import configparser `
            --hidden-import pathlib `
            --hidden-import cryptography `
            --hidden-import cryptography.hazmat.primitives.ciphers.aead `
            --collect-all PIL `
            --collect-all pystray `
            --collect-all requests `
            --collect-all cheroot `
            --collect-all wsgidav `
            --collect-all cryptography `
            --collect-all urllib3 `
            --collect-all charset_normalizer `
            --collect-all certifi `
            --collect-all idna `
            --collect-binaries PIL `
            --collect-binaries pystray `
            --collect-data PIL `
            --collect-data pystray `
            --collect-data certifi `
            --add-binary win_dlls;. `
            --win-private-assemblies `
            --noupx `
            --clean --noconfirm main.py
      - name: Check dist
        run: dir dist
        shell: cmd
      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag_name }} dist/CMCCCloudWebDAV.exe --clobber
          gh release upload ${{ needs.create-release.outputs.tag_name }} dist/CMCCCloudWebDAV-console.exe --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build
        run: |
          pyinstaller --name cmcc-webdav --onefile \
            --hidden-import cheroot.wsgi \
            --hidden-import wsgidav.wsgidav_app \
            --hidden-import wsgidav.dav_provider \
            --hidden-import wsgidav.dir_browser \
            --hidden-import wsgidav.property_manager \
            --hidden-import wsgidav.lock_manager \
            --hidden-import requests \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pystray \
            --hidden-import cryptography \
            --hidden-import cryptography.hazmat.primitives.ciphers.aead \
            --collect-all PIL \
            --collect-all pystray \
            --collect-all requests \
            --collect-all cheroot \
            --collect-all wsgidav \
            --collect-all cryptography \
            --collect-all urllib3 \
            --collect-all charset_normalizer \
            --collect-all certifi \
            --collect-all idna \
            --clean --noconfirm main.py
      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag_name }} dist/cmcc-webdav --clobber

  build-macos:
    needs: create-release
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build
        run: |
          pyinstaller --name cmcc-webdav --onefile \
            --hidden-import cheroot.wsgi \
            --hidden-import wsgidav.wsgidav_app \
            --hidden-import wsgidav.dav_provider \
            --hidden-import wsgidav.dir_browser \
            --hidden-import wsgidav.property_manager \
            --hidden-import wsgidav.lock_manager \
            --hidden-import requests \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pystray \
            --hidden-import cryptography \
            --hidden-import cryptography.hazmat.primitives.ciphers.aead \
            --collect-all PIL \
            --collect-all pystray \
            --collect-all requests \
            --collect-all cheroot \
            --collect-all wsgidav \
            --collect-all cryptography \
            --collect-all urllib3 \
            --collect-all charset_normalizer \
            --collect-all certifi \
            --collect-all idna \
            --clean --noconfirm main.py
      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag_name }} dist/cmcc-webdav --clobber

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install system deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev liblzma-dev python3-virtualenv libgl1-mesa-dev
      - name: Setup Android SDK for Buildozer
        run: |
          export BUILDOZER_DIR=$HOME/.buildozer/android/platform
          export ANDROID_SDK_ROOT=$BUILDOZER_DIR/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" "ndk;25.2.9519653" || true
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK=$BUILDOZER_DIR/android-ndk-r25b" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
      - name: Install Buildozer
        run: |
          pip install buildozer cython
      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROIDSDK }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
        run: |
          export PATH=$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH
          buildozer android debug
      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag_name }} bin/*.apk --clobber
