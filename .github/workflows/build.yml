name: Build Windows EXE and Auto Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build windowed
        run: |
          pyinstaller --name CMCCCloudWebDAV --onefile --windowed `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean --noconfirm main.py

      - name: Build console
        run: |
          pyinstaller --name CMCCCloudWebDAV-console --onefile --console `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean --noconfirm main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMCCCloudWebDAV-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Auto Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*.exe
          tag: v1.0.0-build.${{ github.run_number }}
          overwrite: true
          body: "Auto build run ${{ github.run_number }} commit ${{ github.sha }}"
