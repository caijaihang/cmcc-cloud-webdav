name: Build CMCC Cloud WebDAV and Auto Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build windowed
        run: |
          pyinstaller --name CMCCCloudWebDAV --onefile --windowed `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean --noconfirm main.py
      - name: Build console
        run: |
          pyinstaller --name CMCCCloudWebDAV-console --onefile --console `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean --noconfirm main.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CMCCCloudWebDAV-Windows
          path: dist/*.exe
          retention-days: 30
      - name: List dist
        run: dir dist
        shell: cmd

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build
        run: |
          pyinstaller --name cmcc-webdav --onefile \
            --hidden-import cheroot.wsgi \
            --hidden-import wsgidav.wsgidav_app \
            --hidden-import wsgidav.dav_provider \
            --hidden-import wsgidav.dir_browser \
            --hidden-import wsgidav.property_manager \
            --hidden-import wsgidav.lock_manager \
            --hidden-import requests \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pystray \
            --clean --noconfirm main.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmcc-webdav-linux
          path: dist/cmcc-webdav
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build
        run: |
          pyinstaller --name cmcc-webdav --onefile \
            --hidden-import cheroot.wsgi \
            --hidden-import wsgidav.wsgidav_app \
            --hidden-import wsgidav.dav_provider \
            --hidden-import wsgidav.dir_browser \
            --hidden-import wsgidav.property_manager \
            --hidden-import wsgidav.lock_manager \
            --hidden-import requests \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pystray \
            --clean --noconfirm main.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmcc-webdav-macos
          path: dist/cmcc-webdav
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install buildozer cython
      - name: Build APK
        run: |
          buildozer android debug
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmcc-webdav-android
          path: bin/*.apk
          retention-days: 30

  release:
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success')
    steps:
      - name: Download Windows
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: CMCCCloudWebDAV-Windows
          path: ./dist/windows
      - name: Download Linux
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cmcc-webdav-linux
          path: ./dist/linux
      - name: Download macOS
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cmcc-webdav-macos
          path: ./dist/macos
      - name: Download Android
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cmcc-webdav-android
          path: ./dist/android
      - name: Generate version
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          BUILD=${{ github.run_number }}
          echo "VERSION=v${DATE}-${BUILD}" >> $GITHUB_OUTPUT
      - name: Auto Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/windows/*.exe
            ./dist/linux/cmcc-webdav
            ./dist/macos/cmcc-webdav
            ./dist/android/*.apk
          tag_name: ${{ steps.version.outputs.VERSION }}
          body: |
            Auto build run **#${{ github.run_number }}**
            Commit: `${{ github.sha }}`
            - `CMCCCloudWebDAV.exe` — Windows 窗口版
            - `CMCCCloudWebDAV-console.exe` — Windows 控制台版
            - `cmcc-webdav` — Linux
            - `cmcc-webdav` — macOS
            - `*.apk` — Android
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
