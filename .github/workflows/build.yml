name: Build CMCC Cloud WebDAV and Auto Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python (Win7 compatible)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build windowed
        run: |
          pyinstaller --name CMCCCloudWebDAV --onefile --windowed `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean --noconfirm main.py

      - name: Build console
        run: |
          pyinstaller --name CMCCCloudWebDAV-console --onefile --console `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import wsgidav.property_manager `
            --hidden-import wsgidav.lock_manager `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean --noconfirm main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CMCCCloudWebDAV-Windows
          path: dist/*.exe
          retention-days: 30

      - name: List dist contents
        run: dir dist
        shell: cmd

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller --name cmcc-webdav --onefile \
            --hidden-import cheroot.wsgi \
            --hidden-import wsgidav.wsgidav_app \
            --hidden-import wsgidav.dav_provider \
            --hidden-import wsgidav.dir_browser \
            --hidden-import wsgidav.property_manager \
            --hidden-import wsgidav.lock_manager \
            --hidden-import requests \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pystray \
            --clean --noconfirm main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcc-webdav-linux
          path: dist/cmcc-webdav
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller --name cmcc-webdav --onefile \
            --hidden-import cheroot.wsgi \
            --hidden-import wsgidav.wsgidav_app \
            --hidden-import wsgidav.dav_provider \
            --hidden-import wsgidav.dir_browser \
            --hidden-import wsgidav.property_manager \
            --hidden-import wsgidav.lock_manager \
            --hidden-import requests \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import pystray \
            --clean --noconfirm main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcc-webdav-macos
          path: dist/cmcc-webdav
          retention-days: 30

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CMCCCloudWebDAV-Windows
          path: ./dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cmcc-webdav-linux
          path: ./dist/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cmcc-webdav-macos
          path: ./dist/macos

      - name: Generate version
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          BUILD=${{ github.run_number }}
          echo "VERSION=v${DATE}-${BUILD}" >> $GITHUB_OUTPUT
          echo "Generated version: v${DATE}-${BUILD}"

      - name: Auto Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/windows/*.exe
            ./dist/linux/cmcc-webdav
            ./dist/macos/cmcc-webdav
          tag_name: ${{ steps.version.outputs.VERSION }}
          body: |
            Auto build run **#${{ github.run_number }}**
            Commit: `${{ github.sha }}`
            Branch: `${{ github.ref_name }}`

            ### 下载说明
            - `CMCCCloudWebDAV.exe` — Windows 窗口版（双击运行，无控制台）
            - `CMCCCloudWebDAV-console.exe` — Windows 控制台版（带调试输出）
            - `cmcc-webdav` (Linux) — Linux 单文件可执行程序
            - `cmcc-webdav` (macOS) — macOS 单文件可执行程序
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true
