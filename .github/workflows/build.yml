name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.8']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE (Windowed)
        run: |
          pyinstaller `
            --name CMCCCloudWebDAV `
            --onefile `
            --windowed `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean `
            --noconfirm `
            main.py

      - name: Build EXE (Console Debug)
        run: |
          pyinstaller `
            --name CMCCCloudWebDAV-console `
            --onefile `
            --console `
            --hidden-import cheroot.wsgi `
            --hidden-import wsgidav.wsgidav_app `
            --hidden-import wsgidav.dav_provider `
            --hidden-import wsgidav.dir_browser `
            --hidden-import requests `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            --hidden-import pystray `
            --clean `
            --noconfirm `
            main.py

      - name: List build output
        run: |
          dir dist\
          echo "---"
          dir build\

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CMCCCloudWebDAV-Windows
          path: |
            dist/CMCCCloudWebDAV.exe
            dist/CMCCCloudWebDAV-console.exe
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CMCCCloudWebDAV.exe
            dist/CMCCCloudWebDAV-console.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: |
            dist/CMCCCloudWebDAV.exe
            dist/CMCCCloudWebDAV-console.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
